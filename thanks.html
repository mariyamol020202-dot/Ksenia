<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/>
<title>Спасибо — Ксения Максимовна</title>
<style>
:root{--paper:#fffdf7;--ink:#1d1b18;--red:#a9232b;--red2:#7f1720;--line:#e8c5bd;--muted:#70675f}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(180deg,#fffdf8,#faf4e9);color:var(--ink);font-family:Georgia,"Times New Roman",serif;padding:24px}
.card{position:relative;width:min(720px,100%);background:rgba(255,255,255,.78);border:1px solid var(--line);padding:54px 42px;text-align:center;box-shadow:0 20px 60px rgba(71,39,24,.08)}
.card:before,.card:after{content:"◇";position:absolute;color:var(--red);font-size:22px}.card:before{top:12px;left:16px}.card:after{bottom:12px;right:16px}
.seal{width:52px;height:52px;border:2px solid var(--red);color:var(--red);display:grid;place-items:center;margin:0 auto 22px;font-size:28px;font-weight:700}
h1{font-size:clamp(38px,7vw,68px);line-height:1.03;margin:0 0 18px;font-weight:500}p{font-family:Arial,sans-serif;color:var(--muted);font-size:18px;line-height:1.65;margin:0 auto 28px;max-width:540px}.btn{display:inline-block;text-decoration:none;background:var(--red);color:#fff;padding:14px 24px;border-radius:8px;font-family:Arial,sans-serif;font-weight:700}.btn:hover{background:var(--red2)}
.small{margin-top:20px;font-size:13px}@media(max-width:600px){.card{padding:42px 22px}p{font-size:16px}}
</style>
</head>
<body>
<main class="card">
<div class="seal">谢</div>
<h1>Спасибо за заявку</h1>
<p>Сообщение отправлено. Ксения Максимовна свяжется с вами по контакту, который вы указали в форме.</p>
<a class="btn" href="index.html">Вернуться на сайт</a>
<p class="small">Если это была первая тестовая отправка после подключения FormSubmit, проверьте почту и подтвердите адрес по ссылке из письма сервиса.</p>
</main>
</body>
</html>
